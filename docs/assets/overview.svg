<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">SmartCourse — explainable academic planning</title>
  <desc id="desc">Credit requirements, timetable constraints, and a bounded deterministic search produce a plan with explicit evidence.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102e39"/><stop offset="1" stop-color="#133d47"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#7ce7c1"/><stop offset="1" stop-color="#78bffa"/></linearGradient>
  </defs>
  <rect width="1280" height="380" rx="24" fill="url(#bg)"/>
  <circle cx="1220" cy="15" r="260" fill="#2c7682" opacity=".16"/>
  <circle cx="1010" cy="390" r="220" fill="#2c7682" opacity=".12"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="66" fill="#82d9c1" font-size="14" letter-spacing="3">CREDITS · CONSTRAINTS · EVIDENCE</text>
    <text x="60" y="150" fill="#f1f8fa" font-size="70" font-weight="700">SmartCourse</text>
    <text x="64" y="193" fill="#bcd1da" font-size="22">Make every course plan explainable.</text>
    <rect x="64" y="232" width="474" height="2" fill="url(#accent)"/>
    <text x="64" y="277" fill="#e5f1f3" font-size="17">Full catalog. Timetable checks. Visible search limits.</text>
    <text x="64" y="313" fill="#91b5c1" font-size="15">Java / Spring Boot + Vue · local academic project</text>
    <g transform="translate(700 58)">
      <rect width="500" height="263" rx="16" fill="#0c2630" stroke="#32606c"/>
      <circle cx="25" cy="25" r="5" fill="#7ce7c1"/><circle cx="44" cy="25" r="5" fill="#78bffa"/><circle cx="63" cy="25" r="5" fill="#456b79"/>
      <text x="26" y="72" fill="#8eb5c3" font-size="13" letter-spacing="1.5">PLANNING PIPELINE</text>
      <g fill="#173f4b" stroke="#3f6c78"><rect x="25" y="92" width="140" height="53" rx="9"/><rect x="180" y="92" width="140" height="53" rx="9"/><rect x="335" y="92" width="140" height="53" rx="9"/></g>
      <g fill="#e7f3f6" font-size="14" text-anchor="middle"><text x="95" y="124">Credit gaps</text><text x="250" y="124">Time constraints</text><text x="405" y="124">Bounded search</text></g>
      <path d="M165 119h15m140 0h15M250 145v28" fill="none" stroke="#82d9c1" stroke-width="2"/>
      <rect x="25" y="175" width="450" height="62" rx="9" fill="#193e41" stroke="#4a8f82"/>
      <text x="46" y="202" fill="#9ce6c9" font-size="14">Plan + remaining gaps + evidence</text>
      <text x="46" y="222" fill="#a5c2c9" font-size="12">Complete search, budget limit, or missing data</text>
    </g>
  </g>
</svg>
